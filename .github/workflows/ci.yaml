name: Rust CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu

      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Linting (Clippy)
        run: cargo clippy -- -D warnings

      - name: Build & Run Tests (x86_64)
        run: cargo test --verbose

      - name: Build & Run example (x86_64)
        run: |
          cargo build --examples
          ./target/debug/examples/os_release_check --id Ubuntu --codename noble

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cross-compile with Cross
        run: cross build --target aarch64-unknown-linux-gnu -all-targets --verbose